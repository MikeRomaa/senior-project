[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"


[project]
name = "stargaze"
version = "0.0.0"
description = ""
authors = []
requires-python = ">= 3.12"
dependencies = ["astropy[typing]", "numpy", "rich"]


[project.optional-dependencies]
dev = ["mypy", "ruff"]


[tool.mypy]
python_version = "3.12"
packages = ["stargaze"]
mypy_path = "src"


[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 120
select = ['E', 'F', 'W', 'A', 'PLC', 'PLE', 'PLW', 'I']
